{{ define "title" }}{{ .Title }} &mdash; {{ .Site.Title }}{{ end }}
{{ define "main" }}
<div class="page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Description }}
      <p>{{ . }}</p>
    {{ end }}
  </header>
  <div class="card-grid">
    {{ range .Pages }}
      <a href="{{ .RelPermalink }}" class="card-link">
        <h2>{{ .LinkTitle }}</h2>
        {{ with .Date }}
          <p class="meta">{{ .Format "Jan 2, 2006" }}</p>
        {{ end }}
        {{ with .Summary }}
          <p>{{ . }}</p>
        {{ end }}
      </a>
    {{ end }}
  </div>
</div>
{{ end }}
