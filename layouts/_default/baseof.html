<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Site.Params.description }}{{ . }}{{ end }}" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/finemcp-logo.png" />
    <link rel="apple-touch-icon" href="/images/finemcp-logo.png" />

    <!-- Google Fonts: Fraunces (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body class="{{ if .IsHome }}is-home{{ else }}is-inner{{ end }}">
    {{ partial "header.html" . }}
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    {{ if not .IsHome }}
      {{ partial "footer.html" . }}
    {{ end }}
  </body>
</html>
